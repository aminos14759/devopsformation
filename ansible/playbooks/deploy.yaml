
---
- name: Deploy Spring Boot Backend on Minikube
  hosts: minikube
  become: false

  tasks:

    - name: Check SSH connection
      ping:

    - name: Check Minikube status
      command: minikube status
      register: minikube_status
      changed_when: false

    - name: Display Minikube status
      debug:
        var: minikube_status.stdout_lines

    - name: Create project directory
      file:
        path: /home/vagrant/devopsformation/k8s
        state: directory
        mode: '0755'

    - name: Copy Kubernetes manifests
      copy:
        src: "{{ playbook_dir }}/../../k8s/"
        dest: /home/vagrant/devopsformation/k8s/
        mode: preserve

    - name: Create namespace
      command: >
        kubectl apply
        -f /home/vagrant/devopsformation/k8s/namespace.yaml

    - name: Create PostgreSQL secret
      shell: |
        kubectl create secret generic db-secret \
          --namespace=devops \
          --from-literal=POSTGRES_USER="$POSTGRES_USER" \
          --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
          --dry-run=client -o yaml | kubectl apply -f -
      environment:
        POSTGRES_USER: "{{ postgres_user }}"
        POSTGRES_PASSWORD: "{{ postgres_password }}"
      no_log: true

    - name: Deploy PostgreSQL
      command: >
        kubectl apply
        -f /home/vagrant/devopsformation/k8s/postgres.yaml

    - name: Wait for PostgreSQL
      command: >
        kubectl rollout status deployment/postgres
        -n devops --timeout=180s
      changed_when: false

    - name: Apply backend manifest
      command: >
        kubectl apply
        -f /home/vagrant/devopsformation/k8s/backend.yaml

    - name: Configure backend image
      command: >
        kubectl set image deployment/backend
        backend={{ backend_image }}
        -n devops

    - name: Wait for backend deployment
      command: >
        kubectl rollout status deployment/backend
        -n devops --timeout=180s
      changed_when: false

    - name: Display Kubernetes resources
      command: kubectl get pods,services -n devops
      register: resources
      changed_when: false

    - name: Deployment result
      debug:
        var: resources.stdout_lines
