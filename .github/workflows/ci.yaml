name: CI Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  # ---------- 1. Build et tests ----------
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B package --file pom.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/site/jacoco/

  # ---------- 2. SonarQube + Nexus (self-hosted runner sur la VM) ----------
  sonar-nexus:
    needs: build-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-java génère un settings.xml avec les identifiants Nexus
      # (server-id doit être identique à l'id du repo : deploymentRepo)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: deploymentRepo
          server-username: NEXUS_USER
          server-password: NEXUS_PASS

      - name: Tests + SonarQube analysis
        run: |
          mvn -B verify sonar:sonar \
            -Dsonar.projectKey=devopsbackend \
            -Dsonar.host.url=http://192.168.33.10:9000/ \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Deploy to Nexus
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
        run: |
          mvn -B deploy -DskipTests \
            -DaltDeploymentRepository=deploymentRepo::default::http://192.168.33.10:8081/repository/maven-releases/

  # ---------- 3. Trivy + Docker : scans, build, push ----------
  docker:
    needs: build-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Remplit ~/.m2 pour que Trivy ne retélécharge pas les POM (évite le 429)
      - name: Resolve Maven dependencies
        run: mvn -B dependency:resolve

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Trivy FS scan
        run: |
          trivy fs \
            --scanners vuln \
            --skip-dirs target \
            --timeout 30m \
            --output trivy-fs-report.txt \
            .
          # Pour bloquer le pipeline : ajouter --severity HIGH,CRITICAL --exit-code 1

      - name: Docker build
        run: docker build -t formation-backend:latest .

      - name: Trivy image scan
        run: |
          trivy image \
            --scanners vuln \
            --timeout 30m \
            --output trivy-image-report.txt \
            formation-backend:latest

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-fs-report.txt
            trivy-image-report.txt

      # Vérification temporaire des secrets (à supprimer après le test)
      - name: Check Docker Hub secrets
        run: |
          [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && echo "username OK" || echo "username VIDE"
          [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ] && echo "token OK" || echo "token VIDE"

      - name: Docker Hub login and push
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
          docker tag formation-backend:latest $DOCKER_USER/formation-backend:latest
          docker push $DOCKER_USER/formation-backend:latest
          docker logout